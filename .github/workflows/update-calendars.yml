name: Update public calendar snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    - master
    paths:
      - "scripts/update_calendars.py"
      - ".github/workflows/update-calendars.yml"

permissions:
  contents: write

jobs:
  update-calendars:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download public iCalendar feeds
        run: python scripts/update_calendars.py

      - name: Commit updated calendar snapshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh public calendar snapshots"
          file_pattern: "data/*.ics"
